<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Código bom é aquele que resolve o problema e que outra pessoa consegue entender.">
<title>Código bom é aquele que resolve o problema e que outra pessoa consegue entender.</title>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, Monaco, 'Courier New', monospace; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(16px); } }
@keyframes slide { from { opacity: 0; transform: translateX(-10px); } }
@keyframes float { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes ping { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }

.quote { font-size: 19px; font-style: italic; fill: #94a3b8; animation: up 1.2s cubic-bezier(.2, .7, .2, 1) .2s both; }
.sig { font-size: 12.5px; font-weight: 600; letter-spacing: 4px; fill: #8b5cf6; animation: up 1.2s cubic-bezier(.2, .7, .2, 1) .5s both; }
.w1 { animation: flow 24s linear infinite; }
.w2 { animation: flow 16s linear infinite; }
.w3 { animation: flow 11s linear infinite; }
@keyframes flow { to { transform: translateX(-1000px); } }
.mote { fill: #c4b5fd; animation: rise 8s ease-out infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .8; } 100% { transform: translateY(-120px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
<linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#8b5cf6"/><stop offset=".35" stop-color="#3b82f6"/>
  <stop offset=".65" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
</linearGradient>
</defs>

<text class="quote" x="500" y="56" text-anchor="middle">“Código bom é aquele que resolve o problema e que outra pessoa consegue entender.”</text>
<text class="sig" x="500" y="90" text-anchor="middle">— LUCAS LUZ</text>
