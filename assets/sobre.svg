lay:0.96s">        <tspan class="v">self</tspan><tspan class="p">.</tspan><tspan class="n">estudando_agora</tspan> <tspan class="p">=</tspan> <tspan class="p">[</tspan><tspan class="s">"React"</tspan><tspan class="p">,</tspan> <tspan class="s">"Django"</tspan><tspan class="p">]</tspan></text><text class="mono num ln" x="70" y="269" text-anchor="end" style="animation-delay:1.05s">8</text><text class="mono num ln" x="70" y="294" text-anchor="end" style="animation-delay:1.13s">9</text><text class="mono code ln" x="104" y="294" xml:space="preserve" style="animation-delay:1.13s">        <tspan class="v">self</tspan><tspan class="p">.</tspan><tspan class="n">stack</tspan> <tspan class="p">=</tspan> <tspan class="p">{</tspan></text><text class="mono num ln" x="70" y="319" text-anchor="end" style="animation-delay:1.22s">10</text><text class="mono code ln" x="104" y="319" xml:space="preserve" style="animation-delay:1.22s">            <tspan class="s">"front_end"</tspan><tspan class="p">:</tspan> <tspan class="p">[</tspan><tspan class="s">"HTML"</tspan><tspan class="p">,</tspan> <tspan class="s">"CSS"</tspan><tspan class="p">,</tspan> <tspan class="s">"JavaScript"</tspan><tspan class="p">,</tspan> <tspan class="s">"TypeScript"</tspan><tspan class="p">,</tspan></text><text class="mono num ln" x="70" y="344" text-anchor="end" style="animation-delay:1.30s">11</text><text class="mono code ln" x="104" y="344" xml:space="preserve" style="animation-delay:1.30s">                          <tspan class="s">"React"</tspan><tspan class="p">,</tspan> <tspan class="s">"Next.js"</tspan><tspan class="p">,</tspan> <tspan class="s">"Tailwind"</tspan><tspan class="p">]</tspan><tspan class="p">,</tspan></text><text class="mono num ln" x="70" y="369" text-anchor="end" style="animation-delay:1.39s">12</text><text class="mono code ln" x="104" y="369" xml:space="preserve" style="animation-delay:1.39s">            <tspan class="s">"back_end"</tspan><tspan class="p">:</tspan> <tspan class="p">[</tspan><tspan class="s">"Node.js"</tspan><tspan class="p">,</tspan> <tspan class="s">"Python"</tspan><tspan class="p">,</tspan> <tspan class="s">"Django"</tspan><tspan class="p">]</tspan><tspan class="p">,</tspan></text><text class="mono num ln" x="70" y="394" text-anchor="end" style="animation-delay:1.47s">13</text><text class="mono code ln" x="104" y="394" xml:space="preserve" style="animation-delay:1.47s">            <tspan class="s">"banco_de_dados"</tspan><tspan class="p">:</tspan> <tspan class="p">[</tspan><tspan class="s">"PostgreSQL"</tspan><tspan class="p">]</tspan><tspan class="p">,</tspan></text><text class="mono num ln" x="70" y="419" text-anchor="end" style="animation-delay:1.55s">14</text><text class="mono code ln" x="104" y="419" xml:space="preserve" style="animation-delay:1.55s">            <tspan class="s">"ferramentas"</tspan><tspan class="p">:</tspan> <tspan class="p">[</tspan><tspan class="s">"Git"</tspan><tspan class="p">,</tspan> <tspan class="s">"GitHub"</tspan><tspan class="p">,</tspan> <tspan class="s">"Docker"</tspan><tspan class="p">,</tspan> <tspan class="s">"VS Code"</tspan><tspan class="p">]</tspan><tspan class="p">,</tspan></text><text class="mono num ln" x="70" y="444" text-anchor="end" style="animation-delay:1.64s">15</text><text class="mono code ln" x="104" y="444" xml:space="preserve" style="animation-delay:1.64s">        <tspan class="p">}</tspan></text><text class="mono num ln" x="70" y="469" text-anchor="end" style="animation-delay:1.73s">16</text><text class="mono num ln" x="70" y="494" text-anchor="end" style="animation-delay:1.81s">17</text><text class="mono code ln" x="104" y="494" xml:space="preserve" style="animation-delay:1.81s">        <tspan class="v">self</tspan><tspan class="p">.</tspan><tspan class="n">disponivel_para</tspan> <tspan class="p">=</tspan> <tspan class="p">[</tspan><tspan class="s">"Oportunidades"</tspan><tspan class="p">,</tspan> <tspan class="s">"Freelas"</tspan><tspan class="p">,</tspan> <tspan class="s">"Colaborações"</tspan><tspan class="p">]</tspan></text><text class="mono num ln" x="70" y="519" text-anchor="end" style="animation-delay:1.90s">18</text><text class="mono num ln" x="70" y="544" text-anchor="end" style="animation-delay:1.98s">19</text><text class="mono code ln" x="104" y="544" xml:space="preserve" style="animation-delay:1.98s">    <tspan class="k">def</tspan> <tspan class="f">filosofia</tspan><tspan class="p">(</tspan><tspan class="v">self</tspan><tspan class="p">)</tspan> <tspan class="p">-&gt;</tspan> <tspan class="t">str</tspan><tspan class="p">:</tspan></text><text class="mono num ln" x="70" y="569" text-anchor="end" style="animation-delay:2.07s">20</text><text class="mono code ln" x="104" y="569" xml:space="preserve" style="animation-delay:2.07s">        <tspan class="k">return</tspan> <tspan class="p">(</tspan></text><text class="mono num ln" x="70" y="594" text-anchor="end" style="animation-delay:2.15s">21</text><text class="mono code ln" x="104" y="594" xml:space="preserve" style="animation-delay:2.15s">            <tspan class="s">"Código bom é aquele que resolve o problema "</tspan></text><text class="mono num ln" x="70" y="619" text-anchor="end" style="animation-delay:2.24s">22</text><text class="mono code ln" x="104" y="619" xml:space="preserve" style="animation-delay:2.24s">            <tspan class="s">"e que outra pessoa consegue entender."</tspan></text><text class="mono num ln" x="70" y="644" text-anchor="end" style="animation-delay:2.32s">23</text><text class="mono code ln" x="104" y="644" xml:space="preserve" style="animation-delay:2.32s">        <tspan class="p">)</tspan></text><text class="mono num ln" x="70" y="669" text-anchor="end" style="animation-delay:2.41s">24</text>
