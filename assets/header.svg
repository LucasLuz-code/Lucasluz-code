</linearGradient>
<radialGradient id="orbV"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><radialGradient id="orbB"><stop offset="0" stop-color="#2563eb" stop-opacity="0.5"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient><radialGradient id="orbP"><stop offset="0" stop-color="#db2777" stop-opacity="0.28"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient><radialGradient id="orbC"><stop offset="0" stop-color="#0891b2" stop-opacity="0.4"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
