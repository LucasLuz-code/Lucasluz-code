<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/><stop offset="0.35" stop-color="#6366f1" stop-opacity="0.15"/><stop offset="0.65" stop-color="#22d3ee" stop-opacity="0.1"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0.8"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="14s" begin="0s" repeatCount="indefinite"/></linearGradient>
</defs>

