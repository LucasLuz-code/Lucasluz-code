<radialGradient id="gridFade" cx=".5" cy=".45" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gridMask"><rect width="1000" height="380" fill="url(#gridFade)"/></mask>
<linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat">
