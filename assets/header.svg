<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Lucas Luz — Desenvolvedor Full Stack">
<title>Lucas Luz — Desenvolvedor Full Stack</title>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, Monaco, 'Courier New', monospace; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(16px); } }
@keyframes slide { from { opacity: 0; transform: translateX(-10px); } }
@keyframes float { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes ping { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }

.o1 { animation: d1 24s ease-in-out infinite alternate; }
.o2 { animation: d2 28s ease-in-out infinite alternate; }
.o3 { animation: d1 20s ease-in-out infinite alternate-reverse; }
.o4 { animation: d2 32s ease-in-out infinite alternate-reverse; }
@keyframes d1 { 0% { transform: translate(0, 0); } 50% { transform: translate(110px, 40px); } 100% { transform: translate(-50px, 70px); } }
@keyframes d2 { 0% { transform: translate(0, 0); } 50% { transform: translate(-120px, -30px); } 100% { transform: translate(60px, -60px); } }
.grid { animation: pan 26s linear infinite; }
@keyframes pan { to { transform: translate(44px, 44px); } }
.star { fill: #e0e7ff; animation: twinkle 4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: .85; } }
.mote { fill: #c4b5fd; animation: rise 12s linear infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-320px); opacity: 0; } }
.beam { animation: sweep 11s ease-in-out 1.6s infinite both; }
@keyframes sweep { 0% { transform: translateX(0); } 45%, 100% { transform: translateX(1700px); } }
.eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 7px; fill: #a5b4fc; animation: up 1.1s cubic-bezier(.2, .7, .2, 1) .2s both; }
.name { font-size: 88px; font-weight: 800; letter-spacing: -1px; }
.name-in { animation: up 1.4s cubic-bezier(.2, .7, .2, 1) .45s both; }
.role { font-size: 24px; font-weight: 500; fill: #cbd5e1; opacity: 0; animation: role 12s ease-in-out infinite both; }
.r0 { opacity: 1; animation-delay: 1.1s; }
.r1 { animation-delay: 4.1s; }
.r2 { animation-delay: 7.1s; }
.r3 { animation-delay: 10.1s; }
@keyframes role { 0% { opacity: 0; transform: translateY(12px); } 5%, 22% { opacity: 1; transform: translateY(0); } 27%, 100% { opacity: 0; transform: translateY(-12px); } }
.pill { animation: up 1.1s cubic-bezier(.2, .7, .2, 1) 1.5s both; }
.pill-text { font-size: 14px; font-weight: 500; fill: #bbf7d0; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
