<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-label="Como eu trabalho: código limpo, performance, componentização, boa estrutura, versionamento e aprendizado contínuo">
<title>Como eu trabalho: código limpo, performance, componentização, boa estrutura, versionamento e aprendizado contínuo</title>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, Monaco, 'Courier New', monospace; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(16px); } }
@keyframes slide { from { opacity: 0; transform: translateX(-10px); } }
@keyframes float { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes ping { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }

.card { animation: up 1s cubic-bezier(.2, .7, .2, 1) both; }
.glow { animation: pulse 4s ease-in-out infinite; }
.ct { font-size: 17.5px; font-weight: 700; fill: #f1f5f9; }
.cd { font-size: 14px; fill: #94a3b8; }
.cn { font-size: 12px; fill: #475569; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
