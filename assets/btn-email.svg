<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="E-mail">
<title>E-mail</title>
<style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, Monaco, 'Courier New', monospace; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(16px); } }
@keyframes slide { from { opacity: 0; transform: translateX(-10px); } }
@keyframes float { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes ping { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, .2, 1) infinite; }

.btn { animation: up .9s cubic-bezier(.2, .7, .2, 1) both; }
.lab { font-size: 16.5px; font-weight: 600; fill: #f1f5f9; }
.beam { animation: sweep 5s ease-in-out infinite both; }
@keyframes sweep { 0% { transform: translateX(0); } 40%, 100% { transform: translateX(520px); } }
.glow { animation: pulse 3.5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
<clipPath id="pill"><rect x="1" y="1" width="238" height="62" rx="31.0"/></clipPath>
<linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161c32"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="brand" x1="0" y1="1" x2="1" y2="0"><stop offset="0.00" stop-color="#EA4335"/><stop offset="1.00" stop-color="#FBBC05"/></linearGradient>
<radialGradient id="bg"><stop offset="0" stop-color="#FBBC05" stop-opacity="0.45"/><stop offset="1" stop-color="#FBBC05" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EA4335" stop-opacity="0.95"/><stop offset="0.4" stop-color="#FBBC05" stop-opacity="0.15"/><stop offset="0.7" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#FBBC05" stop-opacity="0.8"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" begin="-5.0s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

<g class="btn" style="animation-delay:0.34s">
  <rect x="1" y="1" width="238" height="62" rx="31.0" fill="url(#bbg)"/>
  <g clip-path="url(#pill)">
    <g transform="rotate(20)"><rect class="beam" x="-160" y="-120" width="70" height="300" fill="url(#beam)" style="animation-delay:2.4s"/></g>
  </g>
  <circle class="glow" cx="38" cy="32" r="24" fill="url(#bg)"/>
  <svg x="27" y="21" width="22" height="22" viewBox="0 0 24 24"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></svg>
  <text class="lab" x="64" y="38">E-mail</text>
  <path d="M199 37 209 27M202 27h7v7" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1.6" y="1.6" width="236.8" height="60.8" rx="30.4" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
</g>

</svg>
